server:
  port: 8084

spring:
  application:
    name: ofertas
  datasource:
    url: jdbc:postgresql://localhost:5433/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: b2bmatch
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  # Mismo secreto que firma los tokens en "usuarios" — necesario para validar
  # el JWT en el filtro de este servicio. Sin default: falla rápido si falta.
  secret: ${JWT_SECRET}

notifications:
  # URL del microservicio "notificaciones". Default apunta al nombre del
  # servicio en docker-compose; en desarrollo local fuera de compose se
  # sobreescribe con localhost:8086.
  api-url: ${NOTIFICACIONES_API_URL:http://notificaciones:8086}

internal:
  service-key: ${INTERNAL_SERVICE_KEY}