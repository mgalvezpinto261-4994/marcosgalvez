server:
  port: 8082

spring:
  application:
    name: perfiles
  datasource:
    url: jdbc:postgresql://localhost:5434/b2bmatch
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    properties:
      hibernate:
        default_schema: b2bmatch_perfiles
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  # Mismo secreto que firma los tokens en "usuarios".
  secret: ${JWT_SECRET}